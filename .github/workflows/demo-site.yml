name: Asteria Platform Console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['demo/web/**', 'demo/evidence/**', 'docs/phase-1-as-is/08-as-is-known-issues.md', 'apps/**', 'docs/adr/**', 'docs/diagrams/**', '.github/workflows/demo-site.yml']
  pull_request:
    paths: ['demo/web/**', 'demo/evidence/**', 'docs/phase-1-as-is/08-as-is-known-issues.md', 'apps/**', 'docs/adr/**', 'docs/diagrams/**', '.github/workflows/demo-site.yml']

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - name: Install locked dependencies
        working-directory: demo/web
        run: npm ci --no-fund
      - name: Validate console and evidence transformations
        working-directory: demo/web
        run: |
          npm run ingest
          npm run lint
          npm test
      - name: Build and audit public allowlist only
        run: python3 demo/web/build.py --output public-site
      - name: Desktop and mobile browser checks
        working-directory: demo/web
        run: npm run test:e2e
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-browser-checks-${{ github.run_id }}
          path: demo/web/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish static evidence
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
