name: orders-api tests build and push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/orders-api/**
      - .github/workflows/orders-api.yml

permissions:
  contents: read
  packages: write

jobs:
  test-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            apps/orders-api/requirements.txt
            apps/orders-api/requirements-dev.txt

      - name: Install Orders dependencies
        working-directory: apps/orders-api
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Run Orders tests
        working-directory: apps/orders-api
        env:
          PYTHONPATH: .
        run: |
          python -m pytest --junitxml=orders-junit.xml

      - name: Upload partial test artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orders-tests-${{ github.run_id }}
          path: apps/orders-api/orders-junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Derive lowercase image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}/orders-api"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push without scan or SBOM
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/orders-api
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record the published image
        shell: bash
        run: |
          printf '%s\n' \
            '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}' \
            > orders-image.txt

      - name: Upload partial image metadata
        uses: actions/upload-artifact@v7
        with:
          name: orders-image-${{ github.run_id }}
          path: orders-image.txt
          if-no-files-found: error
          retention-days: 7
