name: identity-api build and push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/identity-api/**
      - .github/workflows/identity-api.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive lowercase image name
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}/identity-api"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push without tests or scans
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/identity-api
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record the published image
        shell: bash
        run: |
          printf '%s\n' \
            '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}' \
            > identity-image.txt

      - name: Upload partial build metadata
        uses: actions/upload-artifact@v7
        with:
          name: identity-image-${{ github.run_id }}
          path: identity-image.txt
          if-no-files-found: error
          retention-days: 7
