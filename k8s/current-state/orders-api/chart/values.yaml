replicaCount: 1

image:
  repository: docker.io/asteria/orders-api
  tag: m13
  pullPolicy: IfNotPresent

runtime:
  configMapName: orders-runtime
  secretName: orders-postgres

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: orders.asteria.local

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
