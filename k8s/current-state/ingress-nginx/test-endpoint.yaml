---
apiVersion: v1
kind: ConfigMap
metadata:
  name: m10-test-endpoint
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: m10-test-endpoint
    app.kubernetes.io/part-of: asteria
data:
  index.html: |
    M10 ingress endpoint ready
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m10-test-endpoint
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: m10-test-endpoint
    app.kubernetes.io/part-of: asteria
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: m10-test-endpoint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m10-test-endpoint
        app.kubernetes.io/part-of: asteria
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http-echo
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: m10-test-endpoint
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: m10-test-endpoint
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: m10-test-endpoint
    app.kubernetes.io/part-of: asteria
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: m10-test-endpoint
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m10-test-endpoint
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: m10-test-endpoint
    app.kubernetes.io/part-of: asteria
spec:
  ingressClassName: nginx
  rules:
    - host: m10.asteria.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m10-test-endpoint
                port:
                  name: http
