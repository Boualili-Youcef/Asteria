---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: team-identity
  labels:
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/part-of: asteria
    asteria.io/deployment-method: raw-yaml
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-api
        app.kubernetes.io/part-of: asteria
        asteria.io/deployment-method: raw-yaml
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-api
          image: docker.io/asteria/identity-api:m13
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: identity-runtime
            - secretRef:
                name: identity-postgres
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: team-identity
  labels:
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/part-of: asteria
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-api
  namespace: team-identity
  labels:
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/part-of: asteria
spec:
  ingressClassName: nginx
  rules:
    - host: identity.asteria.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity-api
                port:
                  name: http
