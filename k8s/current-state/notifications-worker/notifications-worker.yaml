---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-worker
  namespace: team-notifications
  labels:
    app.kubernetes.io/name: notifications-worker
    app.kubernetes.io/part-of: asteria
    asteria.io/deployment-method: manual-kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications-worker
        app.kubernetes.io/part-of: asteria
        asteria.io/deployment-method: manual-kubectl
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifications-worker
          image: docker.io/asteria/notifications-worker:m13
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notifications-runtime
            - secretRef:
                name: notifications-postgres
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-worker
  namespace: team-notifications
  labels:
    app.kubernetes.io/name: notifications-worker
    app.kubernetes.io/part-of: asteria
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notifications-worker
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
