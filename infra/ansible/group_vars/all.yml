---
# Versions contrôlées des binaires installés hors des dépôts Ubuntu.
terraform_version: "1.15.8"
kubectl_version: "1.35.6"
helm_version: "4.2.0"

# L'image M06 et les binaires ci-dessus sont utilisés en amd64.
asteria_binary_architecture: amd64

# M08 utilise la version majeure fournie par Ubuntu 24.04. Les correctifs de
# sécurité mineurs restent gérés par les dépôts de la distribution.
postgresql_major_version: "16"
postgresql_service_accounts:
  - service: identity-api
    role: identity_app
    database: identity_db
  - service: orders-api
    role: orders_app
    database: orders_db
  - service: notifications-worker
    role: notifications_app
    database: notifications_db

# Version K3s stable vérifiée le 19 juillet 2026. Le script est récupéré depuis
# le tag Git correspondant et contrôlé avant exécution.
k3s_version: "v1.36.2+k3s1"
k3s_install_script_sha256: >-
  46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_overlay_test_image: busybox:1.37.0

# M10 reste sur ingress-nginx conformément à l'architecture AS-IS figée.
ingress_nginx_chart_version: "4.15.1"
ingress_nginx_controller_version: "v1.15.1"
m10_test_host: m10.asteria.local
m10_test_image: busybox:1.37.0
