---
# Versions contrôlées des binaires installés hors des dépôts Ubuntu.
terraform_version: "1.15.8"
kubectl_version: "1.35.6"
helm_version: "4.2.0"

# L'image M06 et les binaires ci-dessus sont utilisés en amd64.
asteria_binary_architecture: amd64

# M08 utilise la version majeure fournie par Ubuntu 24.04. Les correctifs de
# sécurité mineurs restent gérés par les dépôts de la distribution.
postgresql_major_version: "16"
postgresql_service_accounts:
  - service: identity-api
    role: identity_app
    database: identity_db
  - service: orders-api
    role: orders_app
    database: orders_db
  - service: notifications-worker
    role: notifications_app
    database: notifications_db

# Version K3s stable vérifiée le 19 juillet 2026. Le script est récupéré depuis
# le tag Git correspondant et contrôlé avant exécution.
k3s_version: "v1.36.2+k3s1"
k3s_install_script_sha256: >-
  46177d4c99440b4c0311b67233823a8e8a2fc09693f6c89af1a7161e152fbfad
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_overlay_test_image: busybox:1.37.0

# M10 reste sur ingress-nginx conformément à l'architecture AS-IS figée.
ingress_nginx_chart_version: "4.15.1"
ingress_nginx_controller_version: "v1.15.1"
m10_test_host: m10.asteria.local
m10_test_image: busybox:1.37.0

# M11 reproduit le Redis unique et partagé de l'architecture AS-IS.
redis_version: "8.8.0"
redis_image: redis:8.8.0-alpine3.23

# M12 conserve une pile volontairement partielle et sans Alertmanager/Loki.
prometheus_version: "3.12.0"
prometheus_image: prom/prometheus:v3.12.0-distroless
node_exporter_version: "1.11.1"
node_exporter_image: quay.io/prometheus/node-exporter:v1.11.1
grafana_version: "13.1.0"
grafana_image: grafana/grafana:13.1.0
m12_grafana_host: grafana.asteria.local

# T04 utilise le service natif Ubuntu systemd-timesyncd. La référence
# entreprise exige des serveurs NTP internes redondants et authentifiés. Le lab
# utilise la source institutionnelle joignable depuis le réseau provider et
# vérifie le résultat avant de poursuivre.
asteria_ntp_servers:
  - ntp.univ-lille.fr
asteria_ntp_fallback_servers:
  - ntp.ubuntu.com
  - 0.ubuntu.pool.ntp.org
  - 1.ubuntu.pool.ntp.org

# T06 epingle Teleport Community Edition. Le proxy lab reste mono-instance sur
# le bastion ; TLS et l'identite du cluster utilisent une PKI privee hors Git.
teleport_version: "18.11.0"
teleport_cluster_name: asteria-lab
teleport_proxy_hostname: teleport.asteria.lab
teleport_proxy_port: 3080
teleport_min_available_memory_mb: 256
teleport_control_memory_max_mb: 512
teleport_agent_memory_max_mb: 256
