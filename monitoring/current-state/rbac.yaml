---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: asteria
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: asteria-prometheus-discovery
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: asteria
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - nodes
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: asteria-prometheus-discovery
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: asteria
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: asteria-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
